name: SALEK-HYPERCORE-Windows-VST3

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  windows-vst3:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --target SalekHypercore_VST3

      - name: Collect artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem -Recurse -Directory -Filter "*.vst3" | ForEach-Object {
            Copy-Item $_.FullName -Destination "dist/$($_.Name)" -Recurse -Force
          }
          Get-ChildItem -Recurse -Filter "SALEK HYPERCORE.vst3" | ForEach-Object {
            Copy-Item $_.FullName -Destination "dist/" -Recurse -Force
          }

      - name: Upload SALEK-HYPERCORE-Windows-VST3
        uses: actions/upload-artifact@v4
        with:
          name: SALEK-HYPERCORE-Windows-VST3
          path: |
            dist/**
            build/**/*.vst3
          if-no-files-found: warn
